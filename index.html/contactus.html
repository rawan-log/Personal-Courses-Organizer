<!DOCTYPE html>
<html lang="en">
    <head>
   <meta charset="UTF-8">
   <meta name="viewport"
   content="width=device-width,initial-scale=1.0">
   <title>Contact Us</title>
   <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header><h1>Contact Us</h1></header>
        <nav>
            <a href="index.html">Home</a>
            <a href="courses.html">My Courses</a>
            <a href="add-courses.html">Add Courses</a>
            <a href="contactus.html">Contact us </a>
            </nav>
<main>
        <section class="contact-container">
            <h2>Get in Touch</h2>
            <p>Have a question? Drop us a message below!</p>
            <form action="/submit-form-endpoint" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Rawan Omran" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>
            <div class ="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject">
                    <option value="general">General Inquiry"</option>
                    <option value="support">Technical Support</option>
                    <option value="feedback">Feedback</option>
                </select>

            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
            </form>
            </section>
            </main>
         <footer>&copy;2026  Rawan's Courses Organizer portal.</footer>
        </body>
        </html>


<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add Courses</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header><h1>Add Courses</h1></header>
        <nav>
            <a href="index.html">Home</a>
            <a href="courses.html">My Courses</a>
            <a href="add-courses.html">Add Courses</a>
            <a href="contactus.html">Contact us </a>
        
            </nav>
<main>
    <section>
        <form action="#">
            <div class="form-group">
                <label for="course-name">Course Name:</label>
                <input type="text" id="course-name" name="course-name" required>
            </div>
            <div class="form-group">
                <label for="instructor">Instructor:</label>
                <input type="text" id="instructor" name="instructor" required>
            </div>
            <div class="form-group">
                <label for="credit-hours">Credit Hours:</label>
                <input type="number" id="credit-hours" name="credit-hours" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes:</label>
                <textarea id="notes" name="notes"></textarea>
            </div>
            <button type="submit">Add Course</button>
        </form>
        </section>
    </main>
    <footer>&copy;2026 Rawan's Courses Organizer portal.</footer>
    </body>
</html>
